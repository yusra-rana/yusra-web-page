<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
    <link rel="stylesheet" href="green.css">
</head>

<body>

<div id="main">

    <div id="header">
        <h1>Registration Form</h1>
    </div>

    <div id="content">

        <form action="third.html">

            <div id="register-box">

                <div class="control">
                    <span class="label">Login Name</span>
                    <span class="colon">:</span>
                    <input type="text" name="loginname">
                </div>

                <div class="control">
                    <span class="label">Enter Password</span>
                    <span class="colon">:</span>
                    <input type="password" name="password">
                </div>

                <div class="control">
                    <span class="label">Re-enter Password</span>
                    <span class="colon">:</span>
                    <input type="password" name="repassword">
                </div>

                <div class="control">
                    <span class="label">Gender</span>
                    <span class="colon">:</span>

                    <input type="radio" name="gender" value="male">
                    <span>Male</span>

                    <input type="radio" name="gender" value="female">
                    <span>Female</span>
                </div>

                <div class="control">
                    <span class="label">Country</span>
                    <span class="colon">:</span>

                    <select id="dp1" name="country">
                        <option value="China">China</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="Japan">Japan</option>
                    </select>
                </div>

                <div class="control">
                    <span class="label">License</span>
                    <span class="colon">:</span>

                    <textarea rows="5" cols="30" readonly>This is the license agreement. By registering you agree to follow all the rules and terms of this website.</textarea>
                </div>

                <div id="agreement">
                    <input type="checkbox" name="agree" value="yes">
                    <span>I agree to the license</span>
                </div>

                <div id="register-button">
                    <input type="submit" value="Register">
                </div>

            </div>

        </form>

    </div>

    <div id="footer">
        <span>Web Technology</span>
    </div>

</div>

</body>

</html>
