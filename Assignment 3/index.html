<!DOCTYPE html>
<html>
<head>
    <title>Yusra's Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h2>Calculator</h2>

        
        <div class="display">
            <div id="previous-operation"></div>
            <div id="display-value">0</div>
        </div>
        <div class="buttons">

            <button onclick="percentage()">%</button>
            <button onclick="clearEntry()">CE</button>
            <button onclick="clearAll()">AC</button>
            <button onclick="backspace()">⌫</button>

            <button onclick="reciprocal()">1/x</button>
            <button onclick="square()">x²</button>
            <button onclick="squareRoot()">√x</button>
            <button onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="chooseOperator('+')">+</button>

            <button onclick="toggleSign()">+/−</button>
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button onclick="calculate()">=</button>

        </div>

        <p>Yusra Calculator</p>

    </div>
    <script>
        
    </script>

    <script src="script.js"></script>

</body>
</html>
