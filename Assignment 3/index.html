
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yusra's Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator Header -->
        <div class="calculator-header">
            <h2>Calculator</h2>
        </div>

        <!-- Display -->
        <div class="display">
            <div id="previous-operation"></div>
            <div id="display-value">0</div>
        </div>

        <!-- Memory Buttons -->
        <div class="memory-buttons">
            <button onclick="memoryClear()">MC</button>
            <button onclick="memoryRecall()">MR</button>
            <button onclick="memoryAdd()">M+</button>
            <button onclick="memorySubtract()">M−</button>
            <button onclick="memoryStore()">MS</button>
        </div>

        <!-- Main Calculator Buttons -->
        <div class="buttons">

            <!-- First Row -->
            <button class="function" onclick="percentage()">%</button>
            <button class="function" onclick="clearEntry()">CE</button>
            <button class="function" onclick="clearAll()">AC</button>
            <button class="function" onclick="backspace()">⌫</button>

            <!-- Second Row -->
            <button class="function" onclick="reciprocal()">1/x</button>
            <button class="function" onclick="square()">x²</button>
            <button class="function" onclick="squareRoot()">√x</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <!-- Third Row -->
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <!-- Fourth Row -->
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <!-- Fifth Row -->
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <!-- Last Row -->
            <button onclick="toggleSign()">+/−</button>
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

        <!-- Footer -->
        <div class="calculator-footer">
            <span>Yusra calculator</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
